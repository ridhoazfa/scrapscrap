name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node -c src/index.js
          node -c src/cli.js
          node -c src/core/scraper.js
          node -c src/core/crawler-pool.js
          node -c src/core/validator.js
          node -c src/core/process-reaper.js
          node -c src/data/store.js
          node -c src/ui/server.js

      - name: Run verification test suite
        run: |
          node -e "const assert = require('assert'); const store = require('./src/data/store'); const CrawlerPool = require('./src/core/crawler-pool'); const pool = new CrawlerPool(); const csv = store.exportToCsv([{ id: 't1', businessName: '=cmd|A0', primaryEmail: 'a@example.com' }]); assert(csv.includes(\"\'=cmd\"), 'Must neutralize = formula'); assert.strictEqual(pool.enqueueWebsiteCrawl('T', 'http://127.0.0.1'), false); assert.strictEqual(pool.enqueueWebsiteCrawl('T', 'http://169.254.169.254'), false); assert.strictEqual(pool.enqueueWebsiteCrawl('T', 'file:///etc/passwd'), false); console.log('All CI sanity checks passed cleanly.');"
